<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>PlaygroundOSS</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#090a0d; color:#fff; font:16px system-ui,sans-serif }
    #canvas { width:100%; height:100%; display:block; touch-action:none; outline:none }
    #status { position:fixed; inset:0; display:grid; place-content:center; gap:1rem; text-align:center; background:#090a0d; z-index:2 }
    #status.hidden { display:none }
    #detail { opacity:.72; max-width:42rem; overflow-wrap:anywhere }
    progress { width:min(34rem,80vw); height:1rem }
    #fatal { color:#ff9ca8; white-space:pre-wrap }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">
    <strong id="phase">Loading PlaygroundOSS</strong>
    <div id="detail">Starting the WebAssembly runtime…</div>
    <progress id="progress" max="1"></progress>
    <div id="fatal"></div>
  </div>
  <script>
    if (!crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') {
      document.getElementById('fatal').textContent =
        'This build requires Cross-Origin-Opener-Policy: same-origin and ' +
        'Cross-Origin-Embedder-Policy: require-corp.';
      throw new Error('cross-origin isolation is required');
    }
    if (!navigator.storage || typeof navigator.storage.getDirectory !== 'function') {
      document.getElementById('fatal').textContent =
        'This browser does not provide the Origin Private File System.';
      throw new Error('OPFS is required');
    }
    navigator.storage.persist().then(granted =>
      console.info(`persistent browser storage ${granted ? 'granted' :
        'not granted; data remains in OPFS but may be evicted'}`));
    const canvas = document.getElementById('canvas');
    const fullscreenTarget = document.documentElement;
    const mobileBrowser = navigator.userAgentData?.mobile === true ||
      /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
      (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
    if (mobileBrowser) {
      document.addEventListener('pointerdown', async () => {
        const fullscreenElement = document.fullscreenElement ||
          document.webkitFullscreenElement;
        const requestFullscreen = fullscreenTarget.requestFullscreen ||
          fullscreenTarget.webkitRequestFullscreen;
        if (!fullscreenElement && requestFullscreen) {
          try {
            await requestFullscreen.call(fullscreenTarget, { navigationUI: 'hide' });
          } catch (exception) {
            console.info(`mobile fullscreen request was declined: ${exception}`);
          }
        }
        if (screen.orientation?.lock) {
          try {
            await screen.orientation.lock('landscape');
          } catch (exception) {
            console.info(`landscape orientation lock was declined: ${exception}`);
          }
        }
      }, { capture: true, once: true });
    }
    const webTextInputs = new Map();
    const webTextInputColor = color => {
      const red = (color >>> 16) & 0xff;
      const green = (color >>> 8) & 0xff;
      const blue = color & 0xff;
      const alpha = ((color >>> 24) & 0xff) / 255;
      return `rgba(${red},${green},${blue},${alpha})`;
    };
    const styleWebTextInput = entry => {
      const touched = document.activeElement === entry.element;
      entry.element.style.backgroundColor = webTextInputColor(
        touched ? entry.touchBackground : entry.normalBackground);
      entry.element.style.color = webTextInputColor(
        touched ? entry.touchForeground : entry.normalForeground);
    };
    const layoutWebTextInput = entry => {
      const bounds = canvas.getBoundingClientRect();
      const scaleX = canvas.width ? bounds.width / canvas.width : 1;
      const scaleY = canvas.height ? bounds.height / canvas.height : 1;
      entry.element.style.left = `${bounds.left + entry.x * scaleX}px`;
      entry.element.style.top = `${bounds.top + entry.y * scaleY}px`;
      entry.element.style.width = `${entry.width * scaleX}px`;
      entry.element.style.height = `${entry.height * scaleY}px`;
    };
    globalThis.playgroundCreateTextInput =
      (id, password, value, x, y, width, height) => {
        const element = document.createElement('input');
        element.type = password ? 'password' : 'text';
        element.value = value;
        element.autocapitalize = 'off';
        element.autocomplete = 'off';
        element.spellcheck = false;
        element.__playgroundWidgetId = id;
        element.style.cssText =
          'position:fixed;z-index:1;box-sizing:border-box;margin:0;' +
          'padding:2px 6px;border:1px solid #777;border-radius:4px;' +
          'outline:none;background:#fff;color:#000;' +
          'font:16px sans-serif;display:none';
        const entry = {
          element, x, y, width, height,
          normalBackground: 0xffffffff,
          normalForeground: 0xff000000,
          touchBackground: 0xffffffff,
          touchForeground: 0xff000000
        };
        webTextInputs.set(id, entry);
        document.body.appendChild(element);
        element.addEventListener('focus', () => styleWebTextInput(entry));
        element.addEventListener('blur', () => styleWebTextInput(entry));
        styleWebTextInput(entry);
        layoutWebTextInput(entry);
      };
    globalThis.playgroundUpdateTextInput =
      (id, x, y, width, height, visible, enabled) => {
        const entry = webTextInputs.get(id);
        if (!entry)
          return;
        Object.assign(entry, { x, y, width, height });
        entry.element.disabled = !enabled;
        entry.element.style.display = visible ? 'block' : 'none';
        if (!visible && document.activeElement === entry.element)
          entry.element.blur();
        layoutWebTextInput(entry);
      };
    globalThis.playgroundSetTextInputValue = (id, value) => {
      const entry = webTextInputs.get(id);
      if (entry && entry.element.value !== value)
        entry.element.value = value;
    };
    globalThis.playgroundSetTextInputPlaceholder = (id, value) => {
      const entry = webTextInputs.get(id);
      if (entry)
        entry.element.placeholder = value;
    };
    globalThis.playgroundSetTextInputColor = (id, slot, color) => {
      const entry = webTextInputs.get(id);
      if (!entry)
        return;
      if (slot === 0)
        entry.normalBackground = color;
      else if (slot === 1)
        entry.normalForeground = color;
      else if (slot === 2)
        entry.touchBackground = color;
      else if (slot === 3)
        entry.touchForeground = color;
      styleWebTextInput(entry);
    };
    globalThis.playgroundSetTextInputAlignment = (id, alignment) => {
      const entry = webTextInputs.get(id);
      if (entry)
        entry.element.style.textAlign =
          alignment === 1 ? 'center' : alignment === 2 ? 'right' : 'left';
    };
    globalThis.playgroundGetTextInputLength = id => {
      const entry = webTextInputs.get(id);
      return entry ? lengthBytesUTF8(entry.element.value) : -1;
    };
    globalThis.playgroundCopyTextInputValue = (id, address, capacity) => {
      const entry = webTextInputs.get(id);
      if (entry)
        stringToUTF8(entry.element.value, address, capacity);
    };
    globalThis.playgroundTextInputFocused = id => {
      const entry = webTextInputs.get(id);
      return !!entry && document.activeElement === entry.element;
    };
    globalThis.playgroundDestroyTextInput = id => {
      const entry = webTextInputs.get(id);
      if (entry) {
        entry.element.remove();
        webTextInputs.delete(id);
      }
    };
    addEventListener('resize', () => {
      for (const entry of webTextInputs.values())
        layoutWebTextInput(entry);
    });
    globalThis.playgroundSetStatus = (phase, detail, progress) => {
      document.getElementById('phase').textContent = phase;
      document.getElementById('detail').textContent = detail;
      document.getElementById('progress').value = progress;
      if (phase === 'Starting' && progress >= 1)
        document.getElementById('status').classList.add('hidden');
    };
    globalThis.playgroundFatal = message => {
      const status = document.getElementById('status');
      status.classList.remove('hidden');
      document.getElementById('phase').textContent = 'PlaygroundOSS could not start';
      document.getElementById('detail').textContent = '';
      document.getElementById('fatal').textContent = message;
    };
    var Module = {
      canvas,
      print: text => console.log(text),
      printErr: text => console.error(text),
      onAbort: reason => globalThis.playgroundFatal(String(reason))
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
