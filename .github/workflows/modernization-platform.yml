name: Modernization platform contract

on:
  push:
    branches:
      - modernization
  pull_request:
    branches:
      - modernization
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            preset: linux-release
          - name: Windows MSVC
            # The checked-in preset intentionally targets Visual Studio 17.
            # Pin the image rather than following windows-latest to VS 18.
            os: windows-2022
            preset: windows-msvc
          - name: macOS Clang
            os: macos-latest
            preset: macos-clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux engine dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          libcurl4-openssl-dev libfreetype-dev libgles2-mesa-dev libpng-dev
          libssl-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev
          libxi-dev libxrandr-dev libxss-dev libxtst-dev ninja-build pkg-config
      - name: Restore Windows vcpkg binary cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: windows-vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap pinned Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-cache"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout dc31f86a441067d6c2e9e4ad52988eb41ef4f442
          & (Join-Path $root "bootstrap-vcpkg.bat") -disableMetrics
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Run Linux bootstrap, durability, path, packaging, and cookie tests
        if: runner.os == 'Linux'
        run: ctest --test-dir out/build/linux-release --output-on-failure
      - name: Smoke test SDL3 host lifecycle
        if: runner.os == 'Linux'
        run: >-
          ./out/build/linux-release/Engine/modern/host/sdl/playground-desktop-host
          --headless --frames 3
      - name: Exercise Linux platform services
        if: runner.os == 'Linux'
        run: >-
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          ./out/build/linux-release/Engine/modern/runtime/playground-platform-services-probe
          "$(mktemp -d)"
      - name: Exercise Linux movie decoder
        if: runner.os == 'Linux'
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi \
            -i testsrc=size=64x48:rate=10 -t 1 -c:v mpeg4 /tmp/playground-movie.mp4
          ./out/build/linux-release/Engine/modern/runtime/playground-movie-probe \
            /tmp/playground-movie.mp4
      - name: Exercise Windows engine and platform services
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/test_windows_runtime.ps1
          -BuildDirectory out/build/windows-msvc
          -Configuration Release
          -SkipBuild

  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            preset: android-arm64-v8a
          - abi: armeabi-v7a
            preset: android-armeabi-v7a
          - abi: x86
            preset: android-x86
          - abi: x86_64
            preset: android-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

  emscripten:
    name: Emscripten threaded WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23
          actions-cache-folder: emsdk-cache
      - name: Configure complete web engine
        run: cmake --preset web-release
      - name: Build complete web engine
        run: cmake --build --preset web-release -j2
      - name: Build OPFS, pthread, and SQLite qualification probe
        run: ./scripts/build_web_platform_probe.sh
      - name: Exercise cross-origin-isolated OPFS persistence
        env:
          PLAYGROUND_CHROMIUM: google-chrome
        run: |
          python3 scripts/serve_web.py out/web-platform-probe --port 8765 &
          server=$!
          trap 'kill "$server"' EXIT
          node scripts/test_web_platform_probe.mjs http://127.0.0.1:8765/

  wiiu:
    name: Nintendo Wii U PowerPC
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Wii U host and complete engine
        run: >-
          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake
          -S . -B out/build/wiiu-release
          -DCMAKE_BUILD_TYPE=Release
          -DPLAYGROUND_TARGET_PLATFORM=wiiu
          -DPLAYGROUND_BUILD_ENGINE_RUNTIME=ON
          -DPLAYGROUND_BUILD_WIIU_HOST=ON
      - name: Build Wii U probe and complete engine RPX
        run: >-
          cmake --build out/build/wiiu-release -j2
          --target playground-wiiu-host playground-wiiu-engine
      - name: Audit GX2 backend, verified TLS, and artifacts
        shell: bash
        run: |
          grep -qx 'PORT:STRING=WiiU' \
            out/build/wiiu-release/_deps/playground-wiiu-angle/src/playground_wiiu_angle_external-build/CMakeCache.txt
          /opt/devkitpro/devkitPPC/bin/powerpc-eabi-nm -C \
            out/build/wiiu-release/_deps/playground-wiiu-angle/install/lib/libANGLE.a |
            grep 'rx::RendererGX2' >/dev/null
          grep -F 'case angle::FormatID::R4G4B4A4_UNORM:' \
            out/build/wiiu-release/_deps/playground-wiiu-angle/src/playground_wiiu_angle_external/src/libANGLE/renderer/gx2/gx2_format_table.cpp \
            >/dev/null
          test "$(/opt/devkitpro/devkitPPC/bin/powerpc-eabi-nm -C \
            out/build/wiiu-release/Engine/modern/host/wiiu/playground-wiiu-engine.elf |
            awk '$3 == "mbedtls_hardware_poll" { print $2 }')" = T
          test "$(sha256sum \
            out/build/wiiu-release/Engine/modern/host/wiiu/downloads/cacert.pem |
            awk '{ print $1 }')" = \
            f66dff1bdf8f96060b8177976f8b7d9254bc89bc4db933d769f7384d28480bc9
          strings \
            out/build/wiiu-release/Engine/modern/host/wiiu/playground-wiiu-engine.elf |
            grep -Fx '/vol/content/cacert.pem' >/dev/null
          grep -F 'CURLOPT_SSL_VERIFYPEER, 1L' \
            Engine/source/HTTP/CurlTrust.h >/dev/null
          grep -F 'CURLOPT_SSL_VERIFYHOST, 2L' \
            Engine/source/HTTP/CurlTrust.h >/dev/null
          grep -F 'CURLOPT_CAPATH, nullptr' \
            Engine/source/HTTP/CurlTrust.h >/dev/null
          grep -F 'error == VPAD_READ_NO_SAMPLES || error == VPAD_READ_BUSY' \
            Engine/modern/host/wiiu/src/WiiUHost.c >/dev/null
          grep -F 'PLAYGROUND_WIIU_POINTER_UP, host->touchX' \
            Engine/modern/host/wiiu/src/WiiUHost.c >/dev/null
          test -s out/build/wiiu-release/Engine/modern/host/wiiu/playground-wiiu-host.rpx
          test -s out/build/wiiu-release/Engine/modern/host/wiiu/playground-wiiu-engine.rpx
