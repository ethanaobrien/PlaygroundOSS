name: Modernization platform contract

on:
  push:
    branches:
      - modernization
  pull_request:
    branches:
      - modernization
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            preset: linux-release
          - name: Windows MSVC
            os: windows-latest
            preset: windows-msvc
          - name: macOS Clang
            os: macos-latest
            preset: macos-clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Smoke test SDL3 host lifecycle
        if: runner.os == 'Linux'
        run: >-
          ./out/build/linux-release/Engine/modern/host/sdl/playground-desktop-host
          --headless --frames 3

  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            preset: android-arm64-v8a
          - abi: armeabi-v7a
            preset: android-armeabi-v7a
          - abi: x86
            preset: android-x86
          - abi: x86_64
            preset: android-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
