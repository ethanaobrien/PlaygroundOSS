name: Windows installer

on:
  push:
    branches:
      - modernization
    paths:
      - .github/workflows/windows-installer.yml
      - Engine/modern/host/sdl/**
      - installer/windows/**
      - scripts/build_windows_installer.ps1
      - scripts/test_windows_bootstrap.ps1
      - scripts/test_windows_runtime.ps1
  workflow_dispatch:
    inputs:
      app_assets_url:
        description: APK URL containing assets/AppAssets.zip
        required: true
        default: https://ethanthesleepy.one/public/lovelive/sif/Android/lovelive-community.apk
      version:
        description: Installer/application asset version
        required: true
        default: 9.11.0

jobs:
  package:
    # CMakePresets.json intentionally targets Visual Studio 17 2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: windows-vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap pinned dependencies
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-cache"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout dc31f86a441067d6c2e9e4ad52988eb41ef4f442
          & (Join-Path $root "bootstrap-vcpkg.bat") -disableMetrics
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure and build
        shell: pwsh
        run: |
          cmake --preset windows-msvc
          cmake --build --preset windows-msvc
      - name: Verify Windows runtime and bootstrap recovery
        shell: pwsh
        run: ./scripts/test_windows_runtime.ps1 -SkipBuild
      - name: Acquire immutable AppAssets input
        shell: pwsh
        env:
          APP_ASSETS_URL: ${{ inputs.app_assets_url || 'https://ethanthesleepy.one/public/lovelive/sif/Android/lovelive-community.apk' }}
        run: |
          $apk = Join-Path $env:RUNNER_TEMP "lovelive-community.apk"
          $assets = Join-Path $env:RUNNER_TEMP "AppAssets.zip"
          Invoke-WebRequest -Uri $env:APP_ASSETS_URL -OutFile $apk
          & 7z e $apk assets/AppAssets.zip "-o$env:RUNNER_TEMP" -y
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $assets)) {
            throw "The APK did not contain assets/AppAssets.zip"
          }
          Get-FileHash -LiteralPath $apk -Algorithm SHA256
          Get-FileHash -LiteralPath $assets -Algorithm SHA256
          "APP_ASSETS_ZIP=$assets" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: >-
          ./scripts/build_windows_installer.ps1
          -BuildDirectory out/build/windows-msvc
          -Configuration Release
          -AppAssetsZip "$env:APP_ASSETS_ZIP"
          -Version "${{ inputs.version || '9.11.0' }}"
          -OutputDirectory out/package/windows
          -SkipBuild
      - name: Exercise install, upgrade, launch, and uninstall
        shell: pwsh
        run: |
          function Invoke-WaitingProcess {
            param([string]$FilePath, [string[]]$Arguments)
            $quoted = $Arguments | ForEach-Object { '"' + $_.Replace('"', '\"') + '"' }
            $process = Start-Process -FilePath $FilePath -ArgumentList $quoted -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "$FilePath returned $($process.ExitCode)"
            }
          }

          $setup = Get-ChildItem out/package/windows/PlaygroundOSS-SIF-Setup-*.exe |
            Select-Object -First 1
          $program = Join-Path $env:RUNNER_TEMP "PlaygroundOSS SIF"
          $data = Join-Path $env:LOCALAPPDATA "PlaygroundOSS-SIF"

          Invoke-WaitingProcess $setup.FullName @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$program")
          Invoke-WaitingProcess (Join-Path $program "playground-sdl-engine.exe") @('--frames', '120')
          if (-not (Test-Path (Join-Path $data "install/start.lua"))) {
            throw "Installed no-argument/default-root launch failed"
          }
          Set-Content (Join-Path $data "external/upgrade-sentinel.txt") "preserve"

          Invoke-WaitingProcess $setup.FullName @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$program")
          Invoke-WaitingProcess (Join-Path $program "playground-sdl-engine.exe") @('--frames', '1')
          if (-not (Test-Path (Join-Path $data "external/upgrade-sentinel.txt"))) {
            throw "Upgrade did not preserve external data"
          }

          Invoke-WaitingProcess (Join-Path $program "unins000.exe") @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          if (-not (Test-Path (Join-Path $data "external/upgrade-sentinel.txt"))) {
            throw "Default uninstall did not preserve user data"
          }

          Invoke-WaitingProcess $setup.FullName @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$program")
          Invoke-WaitingProcess (Join-Path $program "unins000.exe") @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/REMOVEUSERDATA=1')
          if (Test-Path $data) {
            throw "Explicit data-removal uninstall failed"
          }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PlaygroundOSS-SIF-Windows-${{ inputs.version || '9.11.0' }}
          path: out/package/windows/PlaygroundOSS-SIF-Setup-*.exe
          if-no-files-found: error
